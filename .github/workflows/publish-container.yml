name: Publish production container

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-allocura-${{ github.ref }}
  cancel-in-progress: false

jobs:

  check-deployment-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}

    steps:
      - name: Check merged PR for deployment label
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          pull_requests="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          )"

          deploy="$(
            jq -r \
              'any(.[]; any(.labels[]?; .name == "deploy:production"))' \
              <<< "$pull_requests"
          )"

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

          if [[ "$deploy" == "true" ]]; then
            echo "Deployment label found."
          else
            echo "No deployment label found. Skipping image publication."
          fi

  publish:
    needs: check-deployment-label
    if: needs.check-deployment-label.outputs.deploy == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate publishing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          required_variables=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_CONTAINER_REGISTRY_NAME
            AZURE_CONTAINER_REGISTRY_LOGIN_SERVER
            AZURE_CONTAINER_APP_NAME
            AZURE_RESOURCE_GROUP
          )
          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required repository variable: ${variable}"
              exit 1
            fi
          done

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get short-lived ACR token
        id: acr-token
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          aad_token="$(
            az account get-access-token \
              --scope https://containerregistry.azure.net/.default \
              --tenant "$AZURE_TENANT_ID" \
              --query accessToken \
              --output tsv \
              --only-show-errors
          )"
          if [[ -z "$aad_token" || "$aad_token" == "null" ]]; then
            echo "::error::Azure did not return an AAD access token for ACR."
            exit 1
          fi
          echo "::add-mask::$aad_token"

          token="$(
            curl --fail --silent --show-error \
              --request POST \
              "https://${ACR_LOGIN_SERVER}/oauth2/exchange" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=access_token" \
              --data-urlencode "service=${ACR_LOGIN_SERVER}" \
              --data-urlencode "tenant=${AZURE_TENANT_ID}" \
              --data-urlencode "access_token=${aad_token}" \
            | jq --raw-output '.refresh_token'
          )"
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::ACR did not return a refresh token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/allocura:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy production image
        id: deploy
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          revision_suffix="${GITHUB_SHA:0:10}-${GITHUB_RUN_ATTEMPT}"
          image="${ACR_LOGIN_SERVER}/allocura@${IMAGE_DIGEST}"

          revision_name="$(
            az containerapp update \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$image" \
              --revision-suffix "$revision_suffix" \
              --query properties.latestRevisionName \
              --output tsv \
              --only-show-errors
          )"

          echo "revision_name=$revision_name" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 60); do
            ready_revision="$(
              az containerapp show \
                --name "$AZURE_CONTAINER_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --query properties.latestReadyRevisionName \
                --output tsv \
                --only-show-errors
            )"

            if [[ "$ready_revision" == "$revision_name" ]]; then
              echo "Revision $revision_name is ready."
              exit 0
            fi

            az containerapp revision show \
              --name "$AZURE_CONTAINER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$revision_name" \
              --query '{health:properties.healthState,running:properties.runningState}' \
              --output json \
              --only-show-errors || true

            sleep 10
          done

          echo "::error::Revision did not become ready within 10 minutes."
          exit 1

      - name: Move latest to deployed image
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${ACR_LOGIN_SERVER}/allocura:latest" \
            "${ACR_LOGIN_SERVER}/allocura@${IMAGE_DIGEST}"
