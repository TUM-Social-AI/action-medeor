name: Publish production container

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-action-medeor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate publishing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
        run: |
          set -euo pipefail

          required_variables=(
            AZURE_CLIENT_ID
            AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID
            AZURE_CONTAINER_REGISTRY_NAME
            AZURE_CONTAINER_REGISTRY_LOGIN_SERVER
          )
          for variable in "${required_variables[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing required repository variable: ${variable}"
              exit 1
            fi
          done

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get short-lived ACR token
        id: acr-token
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          aad_token="$(
            az account get-access-token \
              --scope https://containerregistry.azure.net/.default \
              --tenant "$AZURE_TENANT_ID" \
              --query accessToken \
              --output tsv \
              --only-show-errors
          )"
          if [[ -z "$aad_token" || "$aad_token" == "null" ]]; then
            echo "::error::Azure did not return an AAD access token for ACR."
            exit 1
          fi
          echo "::add-mask::$aad_token"

          token="$(
            curl --fail --silent --show-error \
              --request POST \
              "https://${ACR_LOGIN_SERVER}/oauth2/exchange" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=access_token" \
              --data-urlencode "service=${ACR_LOGIN_SERVER}" \
              --data-urlencode "tenant=${AZURE_TENANT_ID}" \
              --data-urlencode "access_token=${aad_token}" \
            | jq --raw-output '.refresh_token'
          )"
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::ACR did not return a refresh token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/action-medeor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
