name: Publish production container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-action-medeor-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get short-lived ACR token
        id: acr-token
        shell: bash
        env:
          ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          ACR_SUFFIX: ${{ vars.AZURE_CONTAINER_REGISTRY_SUFFIX }}
        run: |
          login_args=(
            --name "$ACR_NAME"
            --expose-token
            --output tsv
            --query accessToken
            --only-show-errors
          )
          if [[ -n "$ACR_SUFFIX" ]]; then
            login_args+=(--suffix "$ACR_SUFFIX")
          fi

          token="$(az acr login "${login_args[@]}")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/action-medeor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
