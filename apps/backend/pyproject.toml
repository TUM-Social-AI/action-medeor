[project]
name = "allocura-backend"
version = "0.1.0"
description = "FastAPI backend for Allocura."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17.2",
  "asyncpg>=0.31.0",
  "fastapi>=0.124.4",
  "pydantic-settings>=2.12.0",
  "sqlalchemy[asyncio]>=2.0.45",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
