[project]
name = "allocura-backend"
version = "0.1.0"
description = "FastAPI backend for Allocura."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.17.2",
  "anthropic>=0.125.0",
  "asyncpg>=0.31.0",
  "fastapi>=0.124.4",
  "google-genai>=2.24.0",
  "httpx>=0.28.1",
  "openai>=3.16.2",
  "openpyxl>=3.1.5",
  "pdfplumber>=0.11.10",
  "pydantic-settings>=2.12.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.45",
  "uvicorn[standard]>=0.38.0",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Keep one event loop for the whole test session: app.db.session creates the async engine's
# connection pool once at import time, bound to whichever loop is running then. Per-test loops
# (pytest-asyncio's default) make every test after the first reuse pool connections from a now-closed
# loop and fail with "Future attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests that require a migrated PostgreSQL/pgvector database",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
